<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FrozenMart | Frozen Food Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <a href="#home" class="logo" data-go="home">❄ FrozenMart</a>

        <nav>
            <a href="#home" data-go="home" data-i18n="nav_home"></a>
            <a href="#categories" data-go="categories" data-i18n="nav_cats"></a>
            <a href="#products" data-go="products" data-i18n="nav_products"></a>
            <a href="#about" data-go="about" data-i18n="nav_about"></a>
        </nav>

        <div class="header-right">
            <div id="account" class="account"></div>
            <a href="#" class="cart" data-cart>🛒 <span data-i18n="cart"></span> (<span id="cart-count">0</span>)</a>
        </div>
    </header>

    <section class="hero" id="home">
        <div>
            <p class="tagline" data-i18n="tagline"></p>
            <h1 data-i18n-html="hero_h1"></h1>
            <p data-i18n="hero_p"></p>
            <form class="search-bar" id="searchForm" role="search">
                <input type="search" id="searchInput" data-i18n-ph="search_ph" aria-label="Search">
                <button type="submit" class="btn" data-i18n="search_btn"></button>
            </form>
            <button type="button" class="btn btn-shop" data-cat="all"><span data-i18n="shop_now"></span> →</button>
        </div>
        <div class="hero-image" aria-hidden="true">🐟 🥩 🥦</div>
    </section>

    <main id="homeView">
        <section class="section" id="categories">
            <h2 data-i18n="cats_title"></h2>
            <p class="subtitle" data-i18n="cats_sub"></p>
            <div class="category-grid" id="categoryGrid"></div>
        </section>

        <section class="section products-section" id="products">
            <h2 data-i18n="feat_title"></h2>
            <p class="subtitle" data-i18n="feat_sub"></p>
            <div class="product-grid" id="featuredGrid"></div>
        </section>
    </main>

    <section class="section d-none" id="pageView"></section>

    <section class="section d-none" id="listView">
        <button type="button" class="back-btn" data-go="home">← <span data-i18n="back"></span></button>
        <h2 id="listTitle"></h2>
        <p class="subtitle" id="listSub"></p>
        <div class="product-grid" id="productGrid"></div>
        <div class="empty d-none" id="emptyMsg" data-i18n="no_results"></div>
    </section>

    <section class="about" id="about">
        <h2 data-i18n="about_title"></h2>
        <p data-i18n="about_p"></p>
    </section>

    <footer>
        <p>© 2026 FrozenMart | Online Shopping &amp; Inventory Management System</p>
        <p><a href="admin.html">Owner login</a> · <a href="#" data-reset data-i18n="reset"></a></p>
    </footer>

    <div id="cartOverlay" class="cart-overlay d-none">
        <aside class="cart-panel" role="dialog" aria-modal="true" aria-label="Cart">
            <div class="cart-head">
                <h2 data-i18n="cart_title"></h2>
                <button type="button" class="cart-x" data-cart-close aria-label="Close">✕</button>
            </div>
            <div id="cartItems"></div>
            <div id="cartFoot"></div>
        </aside>
    </div>

    <div id="modal" class="modal3d d-none" role="dialog" aria-modal="true"></div>
    <script src="js/script.js"></script>
</body>
</html>
